packages:
  - 'open-sse'
  - 'electron'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: false
  core-js: set this to true or false
  electron-winstaller: set this to true or false
  esbuild: false
  keytar: false
  koffi: false
  libxmljs2: set this to true or false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  tls-client-node: false
  unrs-resolver: false
